<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Orbit" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Launch notes and delta-v scratchpad." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>Orbit Ledger</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #141a2e;
      --line: #243049;
      --text: #e8eefc;
      --muted: #8b97b3;
      --acc: #5b8cff;
      --acc2: #3dd6c6;
      --danger: #ff6b7a;
      --ok: #6ee7b7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      overflow: hidden;
    }
    body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .app { display: flex; flex-direction: column; height: 100dvh; }
    header.appbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px 8px;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .3px; }
    .logo {
      width: 28px; height: 28px; border-radius: 8px;
      background: radial-gradient(circle at 35% 35%, #7aa2ff, #2a5caa 60%, #12203a);
      box-shadow: 0 0 0 1px #2c3d62;
    }
    .sub { font-size: 11px; color: var(--muted); font-weight: 500; }
    main { flex: 1; overflow: auto; padding: 8px 16px 88px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 14px; margin-bottom: 12px;
    }
    h2 { font-size: 15px; margin: 0 0 10px; font-weight: 650; }
    h3 { font-size: 12px; margin: 12px 0 6px; color: var(--muted); font-weight: 650; text-transform: uppercase; letter-spacing: .4px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, textarea, select {
      width: 100%; background: #0d1426; color: var(--text);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 12px; font-size: 16px;
    }
    textarea { min-height: 88px; resize: vertical; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button {
      border: 0; border-radius: 12px; padding: 12px 14px;
      font-weight: 650; font-size: 15px; color: #071018; background: var(--acc);
    }
    button.ghost { background: #1b2440; color: var(--text); border: 1px solid var(--line); }
    button.wide { width: 100%; margin-top: 10px; }
    .nav {
      position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
      background: #12182c; border: 1px solid var(--line);
      border-radius: 18px; display: flex; padding: 6px;
    }
    .nav button {
      flex: 1; background: transparent; color: var(--muted); padding: 10px 6px; font-size: 12px;
    }
    .nav button.on { color: var(--text); background: #1c2744; }
    .note { font-size: 13px; line-height: 1.45; color: #c5cee3; }
    .chip {
      display: inline-block; font-size: 11px; padding: 4px 8px; border-radius: 999px;
      background: #1b2744; color: var(--acc2); margin: 0 6px 6px 0;
    }
    .chip.x { color: var(--danger); }
    .log-item {
      padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
    }
    .hidden { display: none !important; }
    .pinwrap { text-align: center; padding: 12px 0; }
    .pin-display {
      letter-spacing: 10px; font-size: 28px; font-variant-numeric: tabular-nums;
      margin: 8px 0 16px; min-height: 36px;
    }
    .pad {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 280px; margin: 0 auto;
    }
    .pad button { height: 56px; background: #1a2340; color: var(--text); font-size: 20px; }
    .grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px;
    }
    .grid.one { grid-template-columns: 1fr; }
    .grid img, .grid video {
      width: 100%; border-radius: 12px; background: #0a0f1c; aspect-ratio: 3/4; object-fit: cover;
    }
    .status { font-size: 12px; color: var(--muted); margin-top: 8px; }
    .warn { color: #f5c16c; font-size: 12px; line-height: 1.4; }
    .err { color: var(--danger); font-size: 13px; }
    .install { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .sug {
      display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px;
    }
    .sug button {
      background: #1a2340; color: var(--text); border: 1px solid var(--line);
      font-size: 11px; padding: 7px 9px; border-radius: 999px; font-weight: 600;
    }
    .sug button.on { background: #2a4d8a; border-color: var(--acc); }
    .sug button.ban { background: #3a1c24; border-color: #6a3038; }
    .picked { min-height: 28px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="appbar">
      <div class="brand">
        <div class="logo"></div>
        <div>
          <div id="title">Orbit Ledger</div>
          <div class="sub" id="subtitle">pad notes</div>
        </div>
      </div>
      <span class="chip" id="modechip">career</span>
    </header>
    <main id="main"></main>
    <nav class="nav" id="nav"></nav>
  </div>

  <script>
    const PIN = "91539";
    const KEY = "ol_v1";
    const CATS = [
      { id: "series", name: "Series", tags: ["pokemon","naruto","genshin_impact","one_piece","my_hero_academia","honkai:_star_rail","overwatch","league_of_legends","sonic_the_hedgehog","minecraft"] },
      { id: "character", name: "Character", tags: ["hatsune_miku","2b_(nier:automata)","samus_aran","princess_peach","mario","sonic_the_hedgehog","gwen_stacy","harley_quinn","mercy_(overwatch)","tracer"] },
      { id: "artist", name: "Artist", tags: ["shadman","incognitymous","neocoill","personalami","cutesexyrobutts","crimson_(artist)","sanuki_(kyoudaisuki)","kurohime","bokuman","ewgeng"] },
      { id: "body", name: "Body", tags: ["big_breasts","huge_breasts","thick_thighs","wide_hips","ass","muscular_female","flat_chest","abs","curvy","small_breasts"] },
      { id: "clothes", name: "Clothes", tags: ["nude","swimsuit","school_uniform","lingerie","stockings","shirt","pants","armor","bodysuit","open_clothes"] },
      { id: "act", name: "Act", tags: ["sex","oral","missionary","from_behind","cowgirl_position","standing","kissing","holding_hands","looking_at_viewer","smile"] },
      { id: "count", name: "Count", tags: ["solo","solo_female","duo","group","1girl","1boy","2girls","1girl_1boy","female_only","male_only"] },
      { id: "media", name: "Media", tags: ["animated","video","gif","highres","absurdres","4k","sound","loop","webm","long_video"] },
      { id: "species", name: "Species", tags: ["human","anthro","furry","pokemon_(species)","demon","elf","robot","android","monster_girl","alien"] },
      { id: "extra", name: "Extra", tags: ["female","male","blush","sweat","tongue","ahegao","detailed_background","indoors","outdoors","night"] }
    ];
    const FILTER_TOP = ["ai_generated","young","loli","shota","scat","gore","bestiality","pregnant","rape","ugly_man"];

    const state = {
      tab: "log",
      unlocked: sessionStorage.getItem("ol_ok") === "1",
      pin: "",
      notes: JSON.parse(localStorage.getItem(KEY + "_notes") || '["Check RCS before circularization.","Keep first stage TWR ~1.4.","Do not forget batteries on the lander."]'),
      dv: localStorage.getItem(KEY + "_dv") || "",
      mass: localStorage.getItem(KEY + "_mass") || "",
      isp: localStorage.getItem(KEY + "_isp") || "320",
      want: JSON.parse(localStorage.getItem(KEY + "_want") || "[]"),
      ban: JSON.parse(localStorage.getItem(KEY + "_ban") || "[]"),
      queries: {},
      suggestions: {}
    };

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    const pages = {
      log() {
        return `
          <div class="card">
            <h2>Flight log</h2>
            <p class="note">Scratch notes for the next launch. Nothing leaves this device.</p>
            <textarea id="newnote" placeholder="Add a note…"></textarea>
            <button class="wide" onclick="addNote()">Save note</button>
          </div>
          <div class="card">
            <h2>Recent</h2>
            ${state.notes.map((n,i)=>`<div class="log-item">${esc(n)} <button class="ghost" style="padding:4px 8px;font-size:11px;float:right" onclick="delNote(${i})">remove</button></div>`).join("") || "<div class='note'>Empty.</div>"}
          </div>`;
      },
      calc() {
        return `
          <div class="card">
            <h2>Δv scratchpad</h2>
            <div class="row">
              <div><label>Mass (t)</label><input id="mass" inputmode="decimal" value="${esc(state.mass)}" /></div>
              <div><label>Isp (s)</label><input id="isp" inputmode="decimal" value="${esc(state.isp)}" /></div>
            </div>
            <label>Fuel mass (t)</label>
            <input id="fuel" inputmode="decimal" placeholder="e.g. 8.4" />
            <button class="wide" onclick="doDv()">Estimate Δv</button>
            <div class="status" id="dvout">${state.dv ? "Last: " + esc(state.dv) + " m/s" : "Rocket equation, vacuum approx."}</div>
          </div>
          <div class="card">
            <h2>Pad checklist</h2>
            <div class="note">• SAS / RCS armed<br>• Staging order reviewed<br>• Abort mode set<br>• Comms / batteries green</div>
          </div>`;
      },
      set() {
        return `
          <div class="card">
            <h2>Display</h2>
            <label>Mode label</label>
            <select id="modelabel" onchange="document.getElementById('modechip').textContent=this.value">
              <option>career</option><option>sandbox</option><option>science</option>
            </select>
          </div>
          <div class="card">
            <h2>Install</h2>
            <p class="install">Safari → Share → <b>Add to Home Screen</b>. Opens like a normal app. No App Store listing.</p>
          </div>
          <div class="card">
            <h2>About</h2>
            <p class="note">Orbit Ledger 1.3 — local launch notes. No account.</p>
            <button class="ghost wide" onclick="openDev()">Developer tools</button>
          </div>`;
      },
      pin() {
        return `
          <div class="card pinwrap">
            <h2>Developer access</h2>
            <p class="note">Internal build tools. Restricted.</p>
            <div class="pin-display" id="pindisp">${"•".repeat(state.pin.length) || " "}</div>
            <div class="pad">
              ${[1,2,3,4,5,6,7,8,9,"⌫",0,"OK"].map(v =>
                `<button onclick="pinKey('${v}')">${v}</button>`
              ).join("")}
            </div>
            <div class="err" id="pinerr"></div>
            <button class="ghost wide" onclick="state.tab='set'; render()">Back</button>
          </div>`;
      },
      studio() {
        return `
          <div class="card">
            <h2>Studio</h2>
            <p class="note">Pulls posts from Rule34 by real tags. Empty box = top 10 in that group. Type to narrow; list stays at 10 until the tag is specific enough to pick.</p>
            <div class="picked" id="wantchips">${chips(state.want, false)}</div>
            ${CATS.map(c => catBlock(c, "want")).join("")}
          </div>
          <div class="card">
            <h2>Personal filter</h2>
            <p class="note">Tags to exclude. Same picker: top 10, type to get more specific.</p>
            <div class="picked" id="banchips">${chips(state.ban, true)}</div>
            <label>Filter search</label>
            <input id="q-ban" placeholder="type a tag…" oninput="typeCat('ban', this.value)" />
            <div class="sug" id="sug-ban">${sugButtons(visibleTags("ban"), "ban")}</div>
          </div>
          <div class="card">
            <div class="row">
              <div>
                <label>Count (1–30)</label>
                <input id="count" type="number" min="1" max="30" value="10" />
              </div>
              <div>
                <label>Type</label>
                <select id="kind">
                  <option value="images">Images only</option>
                  <option value="gifs">GIFs only</option>
                  <option value="videos">Videos only</option>
                  <option value="stillmix">Images + GIFs</option>
                </select>
              </div>
            </div>
            <button class="wide" onclick="runSearch()">Search</button>
            <div class="status" id="genstat"></div>
          </div>
          <div id="results"></div>
          <button class="ghost wide" onclick="state.tab='set'; render()">Leave studio</button>`;
      }
    };

    function catBlock(c, mode) {
      const q = state.queries[c.id] || "";
      return `
        <h3>${esc(c.name)}</h3>
        <input id="q-${c.id}" placeholder="type to specify…" value="${esc(q)}" oninput="typeCat('${c.id}', this.value)" />
        <div class="sug" id="sug-${c.id}">${sugButtons(visibleTags(c.id), "want")}</div>`;
    }

    function chips(list, ban) {
      if (!list.length) return `<span class="note">${ban ? "No filters." : "No tags yet."}</span>`;
      return list.map(t => `<span class="chip ${ban?"x":""}" onclick="dropTag('${esc(t)}', ${ban})">${esc(t)} ×</span>`).join("");
    }

    function sugButtons(tags, mode) {
      const selected = mode === "ban" ? state.ban : state.want;
      return tags.map(t => {
        const on = selected.includes(t);
        return `<button class="${on ? (mode==="ban"?"ban":"on") : ""}" onclick="toggleTag('${t.replace(/'/g,"\\'")}', '${mode}')">${esc(t)}</button>`;
      }).join("") || `<span class="note">No matches.</span>`;
    }

    function visibleTags(id) {
      if (id === "ban") {
        const q = (state.queries.ban || "").trim().toLowerCase().replace(/ /g, "_");
        const live = state.suggestions.ban;
        if (q && live && live.length) return live.slice(0, 10);
        if (!q) return FILTER_TOP;
        return FILTER_TOP.filter(t => t.includes(q)).slice(0, 10);
      }
      const cat = CATS.find(c => c.id === id);
      const q = (state.queries[id] || "").trim().toLowerCase().replace(/ /g, "_");
      const live = state.suggestions[id];
      if (q && live && live.length) return live.slice(0, 10);
      if (!q) return cat.tags.slice(0, 10);
      const local = cat.tags.filter(t => t.includes(q));
      return local.slice(0, 10);
    }

    let acTimer = {};
    function typeCat(id, val) {
      state.queries[id] = val;
      const box = document.getElementById("sug-" + id);
      if (box) box.innerHTML = sugButtons(visibleTags(id), id === "ban" ? "ban" : "want");
      clearTimeout(acTimer[id]);
      const q = val.trim();
      if (q.length < 2) {
        state.suggestions[id] = null;
        if (box) box.innerHTML = sugButtons(visibleTags(id), id === "ban" ? "ban" : "want");
        return;
      }
      acTimer[id] = setTimeout(() => fetchAuto(id, q), 220);
    }

    async function fetchAuto(id, q) {
      const tags = await autoTags(q);
      state.suggestions[id] = tags;
      const box = document.getElementById("sug-" + id);
      if (box) box.innerHTML = sugButtons(visibleTags(id), id === "ban" ? "ban" : "want");
    }

    async function autoTags(q) {
      const clean = q.trim().toLowerCase().replace(/\s+/g, "_");
      const url = "https://api.rule34.xxx/autocomplete.php?q=" + encodeURIComponent(clean);
      const data = await getJSON(url);
      if (!Array.isArray(data)) return [];
      return data.map(item => {
        if (typeof item === "string") return item;
        return item.value || item.name || (item.label || "").replace(/\s*\(\d+\)\s*$/, "");
      }).filter(Boolean).slice(0, 10);
    }

    async function getJSON(url) {
      try {
        const r = await fetch(url);
        if (r.ok) return await r.json();
      } catch (e) {}
      try {
        const r = await fetch("https://corsproxy.io/?" + encodeURIComponent(url));
        if (r.ok) return await r.json();
      } catch (e) {}
      try {
        const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url));
        if (r.ok) return await r.json();
      } catch (e) {}
      return [];
    }

    function toggleTag(tag, mode) {
      tag = String(tag).trim().replace(/\s+/g, "_");
      if (!tag) return;
      const list = mode === "ban" ? state.ban : state.want;
      const i = list.indexOf(tag);
      if (i >= 0) list.splice(i, 1);
      else list.push(tag);
      localStorage.setItem(KEY + (mode === "ban" ? "_ban" : "_want"), JSON.stringify(list));
      refreshChips();
      CATS.forEach(c => {
        const box = document.getElementById("sug-" + c.id);
        if (box) box.innerHTML = sugButtons(visibleTags(c.id), "want");
      });
      const banBox = document.getElementById("sug-ban");
      if (banBox) banBox.innerHTML = sugButtons(visibleTags("ban"), "ban");
    }

    function dropTag(tag, ban) {
      toggleTag(tag, ban ? "ban" : "want");
    }

    function refreshChips() {
      const w = document.getElementById("wantchips");
      const b = document.getElementById("banchips");
      if (w) w.innerHTML = chips(state.want, false);
      if (b) b.innerHTML = chips(state.ban, true);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function navHtml() {
      const tabs = state.unlocked
        ? [["log","Log"],["calc","Calc"],["studio","Studio"],["set","Settings"]]
        : [["log","Log"],["calc","Calc"],["set","Settings"]];
      return tabs.map(([id,label]) =>
        `<button class="${state.tab===id|| (state.tab==='pin'&&id==='set')?'on':''}" onclick="go('${id}')">${label}</button>`
      ).join("");
    }

    function go(id) { state.tab = id; render(); }

    function render() {
      const map = { log: pages.log, calc: pages.calc, set: pages.set, pin: pages.pin, studio: pages.studio };
      const fn = map[state.tab] || pages.log;
      document.getElementById("main").innerHTML = fn();
      document.getElementById("nav").innerHTML = navHtml();
      document.getElementById("title").textContent = state.tab === "studio" ? "Studio" : "Orbit Ledger";
      document.getElementById("subtitle").textContent = state.tab === "studio" ? "private" : "pad notes";
    }

    function addNote() {
      const el = document.getElementById("newnote");
      const v = (el.value || "").trim();
      if (!v) return;
      state.notes.unshift(v);
      localStorage.setItem(KEY + "_notes", JSON.stringify(state.notes));
      render();
    }
    function delNote(i) {
      state.notes.splice(i,1);
      localStorage.setItem(KEY + "_notes", JSON.stringify(state.notes));
      render();
    }
    function doDv() {
      const m = parseFloat(document.getElementById("mass").value);
      const isp = parseFloat(document.getElementById("isp").value);
      const fuel = parseFloat(document.getElementById("fuel").value);
      state.mass = document.getElementById("mass").value;
      state.isp = document.getElementById("isp").value;
      localStorage.setItem(KEY+"_mass", state.mass);
      localStorage.setItem(KEY+"_isp", state.isp);
      if (!(m>0 && isp>0 && fuel>0 && fuel<m)) {
        document.getElementById("dvout").textContent = "Need wet mass, fuel mass < wet mass, and Isp.";
        return;
      }
      const dv = Math.round(isp * 9.80665 * Math.log(m / (m - fuel)));
      state.dv = String(dv);
      localStorage.setItem(KEY+"_dv", state.dv);
      document.getElementById("dvout").textContent = "≈ " + dv + " m/s";
    }
    function openDev() { state.pin = ""; state.tab = "pin"; render(); }
    function pinKey(k) {
      const err = document.getElementById("pinerr");
      if (k === "⌫") state.pin = state.pin.slice(0,-1);
      else if (k === "OK") {
        if (state.pin === PIN) {
          state.unlocked = true;
          sessionStorage.setItem("ol_ok","1");
          state.tab = "studio";
          render();
          return;
        }
        err.textContent = "Denied.";
        state.pin = "";
      } else if (state.pin.length < 8) state.pin += k;
      document.getElementById("pindisp").textContent = "•".repeat(state.pin.length) || " ";
    }

    function extOf(url) {
      const p = (url || "").split("?")[0].toLowerCase();
      if (p.endsWith(".gif")) return "gif";
      if (p.endsWith(".mp4") || p.endsWith(".webm")) return "video";
      return "image";
    }

    function matchesKind(kind, type) {
      if (kind === "images") return type === "image";
      if (kind === "gifs") return type === "gif";
      if (kind === "videos") return type === "video";
      if (kind === "stillmix") return type === "image" || type === "gif";
      return true;
    }

    async function runSearch() {
      let count = parseInt(document.getElementById("count").value, 10);
      const kind = document.getElementById("kind").value;
      const stat = document.getElementById("genstat");
      const box = document.getElementById("results");
      if (!(count >= 1 && count <= 30)) count = 10;
      if (!state.want.length && !state.ban.length) {
        stat.textContent = "Pick at least one tag or filter.";
        return;
      }
      const parts = [...state.want, ...state.ban.map(t => "-" + t), "sort:score:desc"];
      if (kind === "gifs") parts.push("gif");
      if (kind === "videos") parts.push("video");
      if (kind === "stillmix") parts.push("-video");
      const tags = parts.join(" ");
      stat.textContent = "Searching…";
      box.innerHTML = "";
      const url = "https://api.rule34.xxx/index.php?page=dapi&s=post&q=index&json=1&limit=100&tags=" + encodeURIComponent(tags);
      let posts = await getJSON(url);
      if (!Array.isArray(posts)) posts = [];
      const filtered = posts.filter(p => {
        const file = p.file_url || p.sample_url || "";
        return matchesKind(kind, extOf(file));
      }).slice(0, count);
      if (!filtered.length) {
        stat.textContent = "No posts for those tags. Loosen filters or check spelling (underscores).";
        return;
      }
      const grid = document.createElement("div");
      grid.className = "grid" + (filtered.length === 1 ? " one" : "");
      filtered.forEach(p => {
        const file = p.file_url || p.sample_url;
        const type = extOf(file);
        if (type === "video") {
          const v = document.createElement("video");
          v.controls = true; v.playsInline = true; v.loop = true; v.muted = true;
          if (p.sample_url && extOf(p.sample_url) === "image") v.poster = p.sample_url;
          else if (p.preview_url) v.poster = p.preview_url;
          const s = document.createElement("source");
          s.src = file;
          v.appendChild(s);
          grid.appendChild(v);
        } else {
          const img = document.createElement("img");
          img.loading = "lazy";
          img.src = p.sample_url || file;
          img.alt = (p.tags || "").slice(0, 80);
          img.onclick = () => window.open(file, "_blank");
          grid.appendChild(img);
        }
      });
      box.appendChild(grid);
      stat.textContent = filtered.length + " posts. Tap a still for full file.";
    }

    render();
  </script>
</body>
</html>
